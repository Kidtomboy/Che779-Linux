name: Phát hành Linux

# Linux: gắn thẻ dạng v1.3.1 (Termux có thẻ riêng termux-v*). Gắn thẻ dạng v1.3.1 (hoặc bấm chạy tay) để tự build và đưa file tải về vào trang Releases.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phat-hanh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Kiểm tra thẻ khớp phiên bản
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          [ "${GITHUB_REF_NAME}" = "v${VER}" ] || { echo "Thẻ ${GITHUB_REF_NAME} không khớp VERSION (${VER})" >&2; exit 1; }
      - name: Lấy mã V1 và V2 đúng commit đã ghim
        run: bash scripts/fetch-sources.sh
      - name: Build 3 jar (V1, V2, Remoter Linux)
        run: bash scripts/build-jars.sh
      - name: Kiểm thử
        run: |
          bash tests/test-script.sh
          bash tests/test-packages.sh
      - name: Ghép che779-linux-v1.sh / -v2.sh, .tar.gz và .deb (v1 và v2)
        run: |
          for v in v1 v2; do
            bash scripts/build-release.sh $v build/jars out
            bash scripts/package-tar.sh $v build/jars out
            bash scripts/package-deb.sh $v build/jars out
          done
      - name: Tạo SHA256SUMS (làm SAU CÙNG, trên đúng file sẽ phát hành)
        run: |
          cd out
          sha256sum che779-linux-v1.sh che779-linux-v2.sh *.tar.gz *.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phat-hanh
          path: out/*
          if-no-files-found: error
      - name: Đưa lên trang Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            ## Che779 Linux ${{ github.ref_name }}
            Mỗi bản có hai phiên bản riêng, tên kèm `-v1` hoặc `-v2`:
            - **V1** (Emulator V1 + Remoter, mỗi tab một cửa sổ): `che779-v1_*_all.deb` (lệnh `che779-v1`), `che779-v1-*-linux.tar.gz`, `che779-linux-v1.sh`.
            - **V2** (nhiều tab trong một cửa sổ): `che779-v2_*_all.deb` (lệnh `che779-v2`), `che779-v2-*-linux.tar.gz`, `che779-linux-v2.sh`.
            - **Ubuntu / Mint / Debian:** `sudo apt install ./che779-v2_*_all.deb` (V1 và V2 cài song song được).
            - **Mọi distro:** giải nén `.tar.gz` rồi chạy `./che779-v1` hoặc `./che779-v2`, hoặc chạy thẳng `bash che779-linux-v2.sh`.
            - **Termux (Android):** bản riêng ở thẻ `termux-v*` (`che779-termux-v1.sh` / `-v2.sh`), xem trang Releases.
            Kiểm tra file tải về bằng `SHA256SUMS.txt` (`sha256sum -c SHA256SUMS.txt`). Chi tiết: `CHANGELOG.md`.
