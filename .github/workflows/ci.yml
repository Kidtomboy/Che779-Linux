name: Kiểm tra (CI)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiem-tra:
    name: Build jar, ghép gói và kiểm thử
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Lấy mã V1 và V2 đúng commit đã ghim
        run: bash scripts/fetch-sources.sh
      - name: Build 3 jar (V1, V2, Remoter Linux)
        run: bash scripts/build-jars.sh
      - name: Kiểm thử che779.sh
        run: bash tests/test-script.sh build/jars/Che779_EmulatorV2.jar
      - name: Kiểm thử gói .deb và .tar.gz
        run: bash tests/test-packages.sh
