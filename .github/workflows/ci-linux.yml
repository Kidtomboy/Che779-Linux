name: Kiểm tra Linux (CI)

on:
  push:
    branches: [ main ]
    paths: [ 'apps/linux/**', 'scripts/**', 'tests/test-script.sh', 'tests/test-packages.sh', 'tests/RemoterCoreTest.java', 'VERSION', 'EMULATOR_V*_REF', '.github/scripts/**', '.github/workflows/ci-linux.yml' ]
  pull_request:
    paths: [ 'apps/linux/**', 'scripts/**', 'tests/test-script.sh', 'tests/test-packages.sh', 'tests/RemoterCoreTest.java', 'VERSION', 'EMULATOR_V*_REF', '.github/scripts/**', '.github/workflows/ci-linux.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiem-tra:
    name: Build jar, ghép gói và kiểm thử
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Lấy mã V1 và V2 đúng commit đã ghim
        run: bash scripts/fetch-sources.sh
      - name: Build 3 jar (V1, V2, Remoter Linux)
        run: bash scripts/build-jars.sh
      - name: Kiểm thử che779-linux-v1.sh và -v2.sh
        run: bash tests/test-script.sh
      - name: Kiểm thử gói .deb và .tar.gz (v1, v2)
        run: bash tests/test-packages.sh

  nhat-ky-build:
    name: Nhật ký build
    if: always() && github.event_name != 'pull_request'
    needs: [kiem-tra]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: buildlog-linux
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: So sánh ghim P1/P2 với nhánh main hiện tại
        run: |
          {
            echo "==== GHIM P1/P2"
            for x in "V1 Che779-Emulator EMULATOR_V1_REF" "V2 Che779-EmulatorV2 EMULATOR_V2_REF"; do
              set -- $x; pin="$(tr -d '[:space:]' < $3)"; head="$(git ls-remote https://github.com/Kidtomboy/$2.git HEAD | cut -f1)"
              if [ "$pin" = "$head" ]; then echo "- $1 ($2): ghim ${pin:0:8} = main mới nhất"; else echo "- $1 ($2): ghim ${pin:0:8}, main đang ở ${head:0:8} → P3 CHƯA theo kịp"; fi
            done
          } > pins.txt
      - name: Đăng nhật ký build lên Release "buildlog-linux"
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-buildlog.sh buildlog-linux "Nhật ký build Linux" pins.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.run_id }}
          path: build-tail.log
          if-no-files-found: ignore
          retention-days: 14
