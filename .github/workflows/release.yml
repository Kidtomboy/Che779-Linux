name: Phát hành

# Gắn thẻ dạng v1.3.0 (hoặc bấm chạy tay) để tự build và đưa file tải về vào trang Releases.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phat-hanh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Lấy mã V1 và V2 đúng commit đã ghim
        run: bash scripts/fetch-sources.sh
      - name: Build 3 jar (V1, V2, Remoter Linux)
        run: bash scripts/build-jars.sh
      - name: Kiểm thử
        run: |
          bash tests/test-script.sh build/jars/Che779_EmulatorV2.jar
          bash tests/test-packages.sh
      - name: Ghép che779.sh, .tar.gz và .deb
        run: |
          bash scripts/build-release.sh build/jars/Che779_EmulatorV2.jar out
          bash scripts/package-tar.sh build/jars out
          bash scripts/package-deb.sh build/jars out
      - name: Tạo SHA256SUMS (làm SAU CÙNG, trên đúng file sẽ phát hành)
        run: |
          cd out
          sha256sum che779.sh *.tar.gz *.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phat-hanh
          path: out/*
          if-no-files-found: error
      - name: Đưa lên trang Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            ## Che779 Linux ${{ github.ref_name }}
            - **Ubuntu / Mint / Debian:** tải `che779_*_all.deb`, cài bằng `sudo apt install ./che779_*_all.deb`; chạy `che779` (V2) hoặc `che779-remoter` (V1 + Remoter).
            - **Mọi distro:** tải `che779-*-linux.tar.gz`, giải nén, chạy `./che779`.
            - `che779.sh`: một file chạy V2 (giữ tạm).
            Kiểm tra file tải về bằng `SHA256SUMS.txt` (`sha256sum -c SHA256SUMS.txt`). Chi tiết: `CHANGELOG.md`.
